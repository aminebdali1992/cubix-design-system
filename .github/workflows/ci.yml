name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit, accessibility and contract tests
        run: npm test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck site and CLI
        run: npm run typecheck

      - name: Build CLI
        run: npm run build:cli

      - name: Readiness contract is in sync
        run: |
          npm run readiness:sync
          if [ -n "$(git status --porcelain -- lib/ready-components.json app/docs/components/components-data.ts)" ]; then
            git status --porcelain -- lib/ready-components.json app/docs/components/components-data.ts
            echo "Readiness data is stale. Run npm run readiness:sync and commit the result."
            exit 1
          fi

      - name: Build docs site
        run: npm run build

      - name: Registry is up to date
        run: |
          npm run registry:build
          if [ -n "$(git status --porcelain -- public/r lib/ready-components.json app/docs/components/components-data.ts)" ]; then
            git status --porcelain -- public/r lib/ready-components.json app/docs/components/components-data.ts
            echo "public/r or readiness data is stale. Run npm run registry:build and commit the result."
            exit 1
          fi

      - name: Registry packaging contract
        run: npm run test:registry

      - name: Ready component quality audit
        run: npm run audit:ready

  cli-smoke:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, aria, radix]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build CLI and registry
        run: |
          npm run build:cli
          npm run cubix -- build ./registry.json -o ./public/r -c .

      - name: Smoke CLI add --all (${{ matrix.base }})
        run: >
          npm run smoke:cli --
          --cli local
          --base ${{ matrix.base }}
          --template vite
          --dir ${{ runner.temp }}/cubix-smoke
