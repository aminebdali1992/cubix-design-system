name: Release CLI

on:
  push:
    tags:
      - "cubix-ui@*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do not pass registry-url here. setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc.
      # With no NPM_TOKEN secret that expands to an empty token, npm skips
      # OIDC Trusted Publishing and fails with ENEEDAUTH or E404.
      # See: https://github.com/actions/setup-node/issues/1551
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Tag matches package version
        run: |
          expected="cubix-ui@$(node -p "require('./packages/cubix/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected"
            exit 1
          fi

      - name: Typecheck and build
        run: |
          npm run typecheck -w cubix-ui
          npm run build -w cubix-ui

      # Configure once on npmjs.com → cubix-ui → Access → Trusted Publisher:
      #   Organization or user: aminebdali1992
      #   Repository: cubix-design-system
      #   Workflow filename: release-cli.yml
      #   Allowed actions: enable "npm publish" (required for direct publish;
      #   configs created after 2026-09-03 default to stage-only otherwise).
      - name: Publish with Trusted Publishing
        run: |
          for rc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "$rc" ] && [ -f "$rc" ]; then
              sed -i '/_authToken/d' "$rc"
            fi
          done
          npm publish -w cubix-ui --access public --provenance
