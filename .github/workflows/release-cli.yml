name: Release CLI

on:
  push:
    tags:
      - "cubix-ui@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. cubix-ui@0.1.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch can target an existing tag without a push event.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Never set registry-url here. It writes an empty _authToken that
      # blocks OIDC Trusted Publishing (ENEEDAUTH / E404).
      # See: https://github.com/actions/setup-node/issues/1551
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@latest
          npm --version
          node --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - run: npm ci

      - name: Resolve release version
        id: release
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          expected="cubix-ui@$(node -p "require('./packages/cubix/package.json').version")"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match $expected"
            exit 1
          fi
          version="${expected#cubix-ui@}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "cubix-ui@${version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "cubix-ui@${version} is already on npm"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "cubix-ui@${version} is not on npm yet"
          fi

      - name: Typecheck and build
        if: steps.release.outputs.already_published != 'true'
        run: |
          npm run typecheck -w cubix-ui
          npm run build -w cubix-ui

      # Auth order:
      # 1) NPM_TOKEN repo secret (granular access token) when present
      # 2) otherwise Trusted Publishing OIDC
      # Trusted Publisher on npmjs.com must allow "npm publish" for path 2.
      - name: Publish
        if: steps.release.outputs.already_published != 'true'
        working-directory: packages/cubix
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for rc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" ../../.npmrc .npmrc; do
            if [ -n "$rc" ] && [ -f "$rc" ]; then
              sed -i '/_authToken/d' "$rc"
            fi
          done

          publish() {
            if [ -n "${NPM_TOKEN:-}" ]; then
              printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
              echo "Publishing with NPM_TOKEN secret"
              npm publish --access public
            else
              unset NODE_AUTH_TOKEN || true
              echo "Publishing with Trusted Publishing (OIDC)"
              npm publish --access public --provenance
            fi
          }

          set +e
          publish
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # Idempotent: a race or a prior local publish should not fail the release.
          if npm view "cubix-ui@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "Publish reported failure, but cubix-ui@${RELEASE_VERSION} is on npm - treating as success"
            exit 0
          fi

          echo "Publish failed and cubix-ui@${RELEASE_VERSION} is still missing from npm"
          exit "$status"

      - name: Skip publish
        if: steps.release.outputs.already_published == 'true'
        run: echo "Nothing to publish for ${{ steps.release.outputs.tag }}"
